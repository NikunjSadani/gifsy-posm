# ─────────────────────────────────────────────────────────────────────────────
# gifsy-posm — LOCAL PARITY ONLY.
#
# ⚠️ NOT used for staging/prod. Those run on Cloud Run (see terraform/ + .github/workflows/).
# This file exists so you can run the real container images against a real Postgres on your
# machine:   docker compose up --build        (then open http://localhost:3000)
#
# Everything below is a throwaway local credential/config — nothing here is a real secret.
# OTP is fixed to 123456 (FIXED_OTP) and media goes to a local volume (STORAGE_DRIVER=local),
# exactly like `npm run start:dev` — no MSG91 / GCS calls are made.
#
# Ports (host → container):
#   postgres 5433 → 5432   (5433 avoids clashing with a native Postgres on 5432)
#   api      4000 → 8080
#   frontend 3000 → 8080
# ─────────────────────────────────────────────────────────────────────────────
name: gifsy-posm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posm_user
      POSTGRES_PASSWORD: posm_pass
      POSTGRES_DB: posm_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posm_user -d posm_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies prisma migrations with the SAME image the api runs (mirrors the
  # `posm-migrate-<env>` Cloud Run Job, which uses this identical command).
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: posm-api:local
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://posm_user:posm_pass@postgres:5432/posm_dev?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: posm-api:local
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://posm_user:posm_pass@postgres:5432/posm_dev?schema=public
      JWT_SECRET: local-dev-only-change-me # MUST equal the frontend's JWT_SECRET below
      JWT_EXPIRES_IN: 60m
      # Local parity: fixed OTP + local-disk media. NODE_ENV=production here, so the fixed-OTP
      # guard requires the explicit ALLOW_FIXED_OTP opt-in (the same switch staging uses).
      FIXED_OTP: "123456"
      ALLOW_FIXED_OTP: "true"
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/.localstorage
      CORS_ORIGINS: http://localhost:3000
      RBAC_ENFORCEMENT: "false"
      LOG_LEVEL: debug
    ports:
      - "4000:8080"
    volumes:
      - localstorage:/app/.localstorage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Slim image has no curl/wget — use node's built-in fetch against the liveness route.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./platform
      dockerfile: Dockerfile
      args:
        # Baked at build time. The Next server proxies /api/* → ${NEXT_PUBLIC_API_URL}/v1/*
        # from INSIDE the compose network, so use the service name, not localhost.
        NEXT_PUBLIC_API_URL: http://api:8080
        NEXT_PUBLIC_CLIENT_ID: kwality
        BUILD_ID: local
    image: posm-frontend:local
    environment:
      NODE_ENV: production
      PORT: "8080"
      JWT_SECRET: local-dev-only-change-me # MUST match the api's JWT_SECRET
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  localstorage:
